name: rrasim
description: تطبيق تعليمي لكتاب المحتوى الجامع رسم الصحابة وضبط التابع.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/book.json
    - assets/data/preface.txt
    - assets/data/chapters/
    - assets/images/
